<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>互動文字雲</title>
<meta name="description" content="大家一起輸入詞彙，即時長出一朵文字雲。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    /* 品牌色系：奶油紙底 × 印章紅 × 明體 */
    --paper:#F6F0E6;        /* 主背景，暖奶油 */
    --paper-2:#FDFAF3;      /* 紙面（舞台、卡片） */
    --ink:#2B2523;          /* 主文字，暖黑 */
    --ink-soft:#6E6258;     /* 次要文字 */
    --ink-faint:#94867A;    /* 更淡的說明文字 */
    --brand:#A61B22;        /* 品牌紅（印章紅） */
    --brand-deep:#7C1015;   /* 深酒紅 */
    --brand-tint:#F3E3DC;   /* 淡紅底 */
    --line:#E2D7C6;         /* 分隔線 */
    --line-soft:#EFE7DA;
    --jade:#2E7D5B;         /* 連線中 */
    --amber:#B0761F;        /* 離線 */
    --serif:"Noto Serif TC","Songti TC","PMingLiU","Times New Roman",serif;
    --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;font-family:var(--sans);color:var(--ink);
    background:
      radial-gradient(900px 520px at 8% -8%, #FBF6EE 0%, transparent 62%),
      radial-gradient(760px 480px at 96% 4%, #F5E9DC 0%, transparent 60%),
      radial-gradient(900px 600px at 50% 118%, #F1E6D4 0%, transparent 58%),
      var(--paper);
    background-attachment:fixed;
    overflow:hidden;
  }

  .app{height:100dvh;display:flex;flex-direction:column;gap:12px;padding:16px clamp(12px,2.6vw,30px) 0}

  /* ---------- 上方刊頭 ---------- */
  .topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;flex:0 0 auto}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}

  /* 紅色方印 */
  .mark{
    display:grid;place-items:center;flex:0 0 auto;width:46px;height:46px;
    background:var(--brand);color:#fff;border-radius:5px;
    font-family:var(--serif);font-weight:700;font-size:25px;line-height:1;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.30), 0 4px 12px -6px rgba(124,16,21,.75);
  }
  .titles{display:flex;flex-direction:column;gap:2px;min-width:0}
  .kicker{
    font-size:10.5px;font-weight:700;color:var(--ink-soft);
    letter-spacing:.26em;text-transform:uppercase;white-space:nowrap;
  }
  .brand h1{
    font-family:var(--serif);font-size:clamp(20px,2.3vw,27px);font-weight:700;
    margin:0;letter-spacing:.10em;color:var(--ink);white-space:nowrap;line-height:1.15;
  }
  .rule{width:1px;height:30px;background:var(--brand);opacity:.42;flex:0 0 auto}
  .subtitle{
    font-family:var(--serif);font-size:15px;color:var(--brand);
    letter-spacing:.14em;white-space:nowrap;font-weight:500;
  }

  .live-dot{width:8px;height:8px;border-radius:50%;background:var(--jade);flex:0 0 auto;
    box-shadow:0 0 0 0 rgba(46,125,91,.55);animation:pulse 2.4s infinite}
  .live-dot.off{background:var(--amber);animation:none}
  @keyframes pulse{70%{box-shadow:0 0 0 8px rgba(46,125,91,0)}100%{box-shadow:0 0 0 0 rgba(46,125,91,0)}}

  .chip{
    display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:999px;
    background:var(--brand-tint);border:1px solid #E7CFC6;color:var(--brand-deep);
    font-size:12.5px;white-space:nowrap;max-width:44vw;overflow:hidden;text-overflow:ellipsis
  }
  .chip b{font-weight:700}
  .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

  .btn{
    appearance:none;border:1px solid var(--line);background:#FFFDF8;color:var(--ink);
    font-family:inherit;font-size:14px;font-weight:700;padding:9px 16px;border-radius:6px;cursor:pointer;
    transition:transform .12s ease,background .18s ease,border-color .18s ease,color .18s ease;
    white-space:nowrap;-webkit-tap-highlight-color:transparent;
  }
  .btn:hover{background:#fff;border-color:#D2C3AC}
  .btn:active{transform:translateY(1px)}
  .btn.primary{
    background:var(--brand);border-color:var(--brand);color:#fff;
    box-shadow:0 4px 12px -6px rgba(124,16,21,.75)
  }
  .btn.primary:hover{background:var(--brand-deep);border-color:var(--brand-deep)}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--ink-soft)}
  .btn.ghost:hover{background:rgba(0,0,0,.04);border-color:transparent}
  .btn.danger{background:#fff;border-color:#DDB3AE;color:var(--brand)}
  .btn.danger:hover{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  /* ---------- 舞台（紙面） ---------- */
  .stage{
    position:relative;flex:1 1 auto;min-height:0;border-radius:6px;
    background:var(--paper-2);border:1px solid var(--line);
    box-shadow:0 1px 0 #fff inset, 0 20px 44px -34px rgba(80,52,36,.55);
    overflow:hidden;
  }
  .stage::after{ /* 內框，印刷版面感 */
    content:'';position:absolute;inset:9px;border:1px solid var(--line-soft);
    border-radius:3px;pointer-events:none;
  }
  .cloud{position:absolute;inset:0;overflow:hidden;transition:opacity .45s ease,filter .45s ease}
  .cloud.is-hidden{opacity:0;pointer-events:none;filter:blur(12px)}

  .word{
    position:absolute;left:0;top:0;font-family:var(--serif);line-height:1.06;white-space:nowrap;
    cursor:default;user-select:none;letter-spacing:.01em;
    transition:left .65s cubic-bezier(.22,1,.36,1),top .65s cubic-bezier(.22,1,.36,1),
               font-size .65s cubic-bezier(.22,1,.36,1),color .5s ease,
               opacity .45s ease,transform .5s cubic-bezier(.34,1.56,.64,1);
  }
  .word.v{writing-mode:vertical-rl;text-orientation:upright;line-height:1.04}
  .word.enter{opacity:0 !important;transform:scale(.25)}
  .word.pop{animation:pop .7s cubic-bezier(.34,1.56,.64,1)}
  @keyframes pop{0%{filter:brightness(1.45) saturate(1.5)}100%{filter:none}}

  .overlay{
    position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    flex-direction:column;gap:14px;text-align:center;padding:28px;
  }
  .overlay.show{display:flex}
  .overlay .big{font-family:var(--serif);font-size:clamp(21px,3.4vw,34px);font-weight:700;
    color:var(--ink);letter-spacing:.08em}
  .overlay .sub{color:var(--ink-soft);font-size:15px;max-width:44ch;line-height:1.85}
  .counter{
    font-family:var(--serif);font-size:clamp(52px,12vw,148px);font-weight:700;line-height:1;
    color:var(--brand);letter-spacing:.02em;
  }

  /* ---------- 輸入區 ---------- */
  .composer{flex:0 0 auto;padding:0 0 16px}
  .composer form{display:flex;gap:10px}
  .composer input{
    flex:1;min-width:0;font-family:inherit;font-size:17px;font-weight:500;color:var(--ink);
    background:#FFFDF8;border:1px solid var(--line);border-radius:6px;padding:14px 16px;
    transition:border-color .18s,box-shadow .18s;
  }
  .composer input::placeholder{color:var(--ink-faint)}
  .composer input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(166,27,34,.10)}
  .composer form .btn{padding:0 24px;font-size:16px}
  .metabar{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    margin-top:10px;font-size:12.5px;color:var(--ink-soft);min-height:20px
  }
  .metabar .sep{opacity:.4}
  .link{background:none;border:none;color:var(--brand);font:inherit;font-size:12.5px;
    cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
  .link:hover{color:var(--brand-deep)}
  .link:disabled{opacity:.4;cursor:not-allowed;text-decoration:none;color:var(--ink-faint)}

  /* ---------- QR 面板 ---------- */
  .qr{
    position:fixed;right:clamp(12px,2.6vw,30px);bottom:clamp(12px,2.6vw,30px);z-index:40;
    width:min(300px,84vw);background:var(--paper-2);border:1px solid var(--line);border-radius:8px;
    padding:20px;box-shadow:0 26px 60px -30px rgba(80,52,36,.6);text-align:center;
    transform:translateY(18px) scale(.96);opacity:0;pointer-events:none;
    transition:.28s cubic-bezier(.22,1,.36,1);
  }
  .qr.show{transform:none;opacity:1;pointer-events:auto}
  .qr h3{margin:0 0 5px;font-family:var(--serif);font-size:17px;font-weight:700;
    color:var(--brand);letter-spacing:.14em}
  .qr p{margin:0 0 14px;font-size:12.5px;color:var(--ink-soft);letter-spacing:.03em}
  .qr .frame{background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px;
    display:inline-block;line-height:0;min-width:242px;min-height:242px}
  .qr canvas,.qr img{width:220px;max-width:100%;height:auto;display:block;border-radius:3px}
  .qr-note{width:220px;height:220px;display:flex;align-items:center;justify-content:center;
    color:var(--ink-faint);font-size:13px;line-height:1.8;text-align:center;padding:16px}
  .qr .url{
    margin-top:13px;font-size:11.5px;color:var(--ink-soft);word-break:break-all;line-height:1.6;
    background:var(--paper);border:1px solid var(--line-soft);border-radius:5px;padding:8px 10px;
  }
  .qr .row{display:flex;gap:8px;margin-top:11px}
  .qr .row .btn{flex:1;padding:8px 10px;font-size:13px}

  /* ---------- 管理列 ---------- */
  .admin{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:11px;
    padding:9px 13px;border-radius:6px;
    background:var(--brand-tint);border:1px dashed #D6ADA6;
    font-size:12.5px;color:var(--brand-deep);font-weight:700
  }
  .admin input{
    font-family:inherit;font-size:13px;font-weight:500;color:var(--ink);background:#fff;
    border:1px solid #E0C6BE;border-radius:5px;padding:6px 10px;width:150px
  }
  .admin input:focus{outline:none;border-color:var(--brand)}
  .admin .btn{padding:6px 12px;font-size:13px}
  .admin .grow{margin-left:auto}

  /* ---------- 提示 ---------- */
  .toast{
    position:fixed;left:50%;bottom:28px;transform:translate(-50%,26px);z-index:60;
    background:var(--ink);border:1px solid rgba(0,0,0,.1);color:var(--paper);
    font-size:14px;font-weight:700;letter-spacing:.04em;
    padding:12px 20px;border-radius:6px;box-shadow:0 18px 40px -20px rgba(43,37,35,.7);
    opacity:0;pointer-events:none;transition:.26s ease
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.warn{background:var(--brand-deep);border-color:var(--brand-deep)}

  /* ---------- 投影模式 ---------- */
  body.project .composer,body.project .admin{display:none}
  body.project .topbar{opacity:.3;transition:opacity .3s}
  body.project .topbar:hover{opacity:1}
  body.project .stage{margin-bottom:16px}

  @media (max-width:820px){
    .rule,.subtitle{display:none}
  }
  @media (max-width:720px){
    .app{padding:12px 12px 0;gap:10px}
    .mark{width:38px;height:38px;font-size:21px;border-radius:4px}
    .brand h1{font-size:19px;letter-spacing:.06em}
    .kicker{font-size:9.5px;letter-spacing:.2em}
    .actions{width:100%;margin-left:0}
    .actions .btn{flex:1;padding:9px 8px;font-size:13px}
    .composer input{font-size:16px;padding:13px 14px}
    .composer form .btn{padding:0 18px}
    .qr{left:12px;right:12px;width:auto}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important}
  }
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="mark" aria-hidden="true">雲</span>
      <div class="titles">
        <span class="kicker">Word Cloud</span>
        <h1>互動文字雲</h1>
      </div>
      <span class="rule" aria-hidden="true"></span>
      <span class="subtitle">課堂即時共創</span>
      <span class="live-dot" id="liveDot" title="連線狀態"></span>
      <span class="chip" id="roomChip">主題：<b>—</b></span>
    </div>
    <div class="actions">
      <button class="btn primary" id="toggleCloud">隱藏文字雲</button>
      <button class="btn" id="toggleQr">QR Code</button>
      <button class="btn" id="projectBtn">投影模式</button>
    </div>
  </header>

  <main class="stage">
    <div class="cloud" id="cloud"></div>

    <div class="overlay" id="emptyState">
      <div class="big">還沒有任何詞彙</div>
      <div class="sub">在下面的輸入框打一個詞、按 Enter，它就會浮上來。<br>同一個詞被越多人送出，字就會長得越大。</div>
    </div>

    <div class="overlay" id="hiddenState">
      <div class="sub">目前已收集</div>
      <div class="counter" id="hiddenCount">0</div>
      <div class="sub">文字雲已隱藏，大家可以繼續投稿。<br>按上方「顯示文字雲」一次揭曉。</div>
    </div>
  </main>

  <section class="composer">
    <div class="admin" id="adminBar" style="display:none">
      <span>🔧 管理模式</span>
      <input id="roomInput" placeholder="主題代號" maxlength="40">
      <button class="btn" id="roomGo">切換主題</button>
      <button class="btn danger grow" id="clearBtn">清空這個主題</button>
    </div>
    <form id="wordForm" autocomplete="off">
      <input id="wordInput" maxlength="30" placeholder="輸入一個詞，按 Enter 送出（可用逗號一次送多個）" enterkeyhint="send">
      <button class="btn primary" type="submit">加入</button>
    </form>
    <div class="metabar">
      <span id="stats">載入中…</span>
      <span class="sep">·</span>
      <span id="statusText">連線中…</span>
      <span class="sep">·</span>
      <button class="link" id="undoBtn" disabled>撤回我上一個詞</button>
    </div>
  </section>
</div>

<aside class="qr" id="qrPanel">
  <h3>掃我一起加入</h3>
  <p>手機掃描後就能輸入詞彙</p>
  <div class="frame" id="qrFrame"><div class="qr-note">產生中…</div></div>
  <div class="url" id="qrUrl">—</div>
  <div class="row">
    <button class="btn" id="copyUrl">複製網址</button>
    <button class="btn ghost" id="closeQr">關閉</button>
  </div>
</aside>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script>
(function(){
'use strict';

/* ============================================================
   設定
   ============================================================ */
var SUPABASE_URL = 'https://qdpklfsrgdtgbsutckib.supabase.co';
var SUPABASE_KEY = 'sb_publishable_e1XwlArxGr9KKwOtIsGDwQ_4I17iX4F';
var TABLE        = 'wordcloud_entries';
var MAX_WORDS    = 200;   // 畫面上最多嘗試排入幾個「不同的詞」
var MAX_ROWS     = 1000;  // 一個主題最多讀幾筆（PostgREST 單次上限就是 1000）

/* 配色分兩層：最熱門的詞用品牌紅家族領銜，其餘用同一套暖色系陪襯。
   顏色由詞彙 hash 決定，所以同一個詞重排時不會變色 —— 除非它的熱度晉升到領銜層。 */
var BRAND_RED    = '#A61B22';
var PALETTE_LEAD = ['#A61B22','#7C1015','#8C3A2E'];
var PALETTE_BASE = ['#B04A22','#8A5D16','#7A5230','#556326','#2F6B4F',
                    '#256B60','#1F4E6B','#3B3A6B','#6B2A54','#4A4642'];

function colorFor(text, t, rank){
  if (rank === 0) return BRAND_RED;                                  // 票王固定用品牌紅
  if (t > 0.66)  return PALETTE_LEAD[hash(text) % PALETTE_LEAD.length];
  return PALETTE_BASE[hash(text) % PALETTE_BASE.length];
}

/* ============================================================
   狀態
   ============================================================ */
var params  = new URLSearchParams(location.search);
var room    = (params.get('room') || 'default').slice(0, 40);
var isAdmin = params.get('admin') === '1';
var entries = [];              // [{id, word}]
var cloudVisible = true;
var online = false;
var sb = null;
var nodes = new Map();         // word -> element
var measurer = document.createElement('canvas').getContext('2d');
var booted = false;

var $ = function(id){ return document.getElementById(id); };
var cloudEl = $('cloud');

/* ============================================================
   小工具
   ============================================================ */
function hash(s){
  var h = 2166136261;
  for (var i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function clamp(v, a, b){ return Math.min(b, Math.max(a, v)); }
function isCJK(s){
  var m = s.match(/[㐀-䶿一-鿿豈-﫿]/g);
  return !!m && m.length >= s.length * 0.8;
}
var toastTimer;
function toast(msg, warn){
  var t = $('toast');
  t.textContent = msg;
  t.className = 'toast show' + (warn ? ' warn' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.className = 'toast'; }, 2600);
}
function setStatus(text, ok){
  $('statusText').textContent = text;
  $('liveDot').className = 'live-dot' + (ok ? '' : ' off');
}

/* 本機備援：Supabase 連不上時仍可單機使用 */
var LKEY = 'wordcloud:' + room;
function localLoad(){ try { return JSON.parse(localStorage.getItem(LKEY)) || []; } catch(e){ return []; } }
function localSave(){ try { localStorage.setItem(LKEY, JSON.stringify(entries)); } catch(e){} }

/* 記住自己送出過哪些 id，才能「撤回」 */
var MKEY = 'wordcloud:mine:' + room;
function mineLoad(){ try { return JSON.parse(localStorage.getItem(MKEY)) || []; } catch(e){ return []; } }
function mineSave(){ try { localStorage.setItem(MKEY, JSON.stringify(mine.slice(-50))); } catch(e){} }
var mine = mineLoad();
function refreshUndo(){
  var live = mine.filter(function(id){
    return entries.some(function(e){ return String(e.id) === String(id); });
  });
  if (live.length !== mine.length){ mine = live; mineSave(); }
  $('undoBtn').disabled = mine.length === 0;
}

/* ============================================================
   排版：由大到小，沿阿基米德螺線找不重疊的位置
   ============================================================ */
/* 字重跟著票數走：越熱門的詞越粗，做出刊物標題的層次感。
   量測用的字型與字重必須跟實際渲染完全一致，否則碰撞偵測會失準。 */
function weightFor(t){ return t > 0.66 ? 900 : (t > 0.30 ? 700 : 500); }

function measure(text, size, vertical, weight){
  var pad = Math.max(3, size * 0.10);
  var w, h;
  if (vertical){
    w = size * 1.12;
    h = size * 1.06 * text.length;
  } else {
    measurer.font = weight + ' ' + size + 'px "Noto Serif TC","Songti TC",serif';
    w = measurer.measureText(text).width;
    h = size * 1.16;
  }
  return { w: w + pad * 2, h: h + pad * 2, pad: pad };
}

function hits(box, placed){
  for (var i = 0; i < placed.length; i++){
    var p = placed[i];
    if (box.x < p.x + p.w && box.x + box.w > p.x &&
        box.y < p.y + p.h && box.y + box.h > p.y) return true;
  }
  return false;
}

function layout(list, W, H, maxSize, minSize){
  var placed = [], result = [];
  var maxN = list[0].n, minN = list[list.length - 1].n;
  var span = Math.max(1, maxN - minN);
  var cx = W / 2, cy = H / 2;
  var aspect = W / H;
  var maxR = Math.sqrt(W * W + H * H) / 2;

  for (var i = 0; i < list.length; i++){
    var item = list[i];
    var t = (maxN === minN) ? 0.62 : (item.n - minN) / span;
    var size = minSize + (maxSize - minSize) * Math.pow(t, 0.62);
    var weight = weightFor(t);
    var vertical = isCJK(item.text) && item.text.length >= 2 && item.text.length <= 5 && (hash(item.text) % 5 === 0);

    var spot = null;
    for (var attempt = 0; attempt < 3 && !spot; attempt++){
      var s = size * (attempt === 0 ? 1 : (attempt === 1 ? 0.78 : 0.58));
      if (s < 10) break;
      var m = measure(item.text, s, vertical, weight);
      if (m.w > W - 4 || m.h > H - 4) continue;

      for (var step = 0; step < 5200; step++){
        var ang = step * 0.30;
        var r = 0.85 * ang;
        if (r > maxR * 1.2) break;
        var x = cx + r * Math.cos(ang) * (aspect > 1 ? aspect * 0.92 : 1) - m.w / 2;
        var y = cy + r * Math.sin(ang) * (aspect < 1 ? (1 / aspect) * 0.92 : 1) - m.h / 2;
        if (x < 2 || y < 2 || x + m.w > W - 2 || y + m.h > H - 2) continue;
        var box = { x: x, y: y, w: m.w, h: m.h };
        if (!hits(box, placed)){
          placed.push(box);
          spot = { x: x + m.pad, y: y + m.pad, size: s, vertical: vertical };
          break;
        }
      }
    }
    if (spot) result.push({ text: item.text, n: item.n, x: spot.x, y: spot.y,
                            size: spot.size, vertical: spot.vertical, weight: weight, t: t });
  }
  return result;
}

/* ============================================================
   繪製
   ============================================================ */
function render(highlight){
  var counts = new Map();
  for (var i = 0; i < entries.length; i++){
    var w = entries[i].word;
    counts.set(w, (counts.get(w) || 0) + 1);
  }

  var list = [];
  counts.forEach(function(n, text){ list.push({ text: text, n: n }); });
  list.sort(function(a, b){ return b.n - a.n || a.text.localeCompare(b.text, 'zh-Hant'); });
  if (list.length > MAX_WORDS) list = list.slice(0, MAX_WORDS);

  $('stats').textContent = entries.length
    ? ('共 ' + entries.length + ' 筆投稿 · ' + counts.size + ' 個不同的詞')
    : '還沒有人投稿';
  $('hiddenCount').textContent = String(entries.length);
  $('emptyState').classList.toggle('show', list.length === 0 && cloudVisible);
  $('hiddenState').classList.toggle('show', !cloudVisible);

  if (!list.length){
    nodes.forEach(function(el){ el.remove(); });
    nodes.clear();
    return;
  }

  var W = cloudEl.clientWidth, H = cloudEl.clientHeight;
  if (W < 40 || H < 40) return;

  // 依畫布大小與詞數推估字級；放不下就整體縮小重排
  var base = Math.sqrt((W * H) / Math.max(10, list.length));
  var maxSize = clamp(base * 1.05, 26, Math.min(W * 0.44, H * 0.40));
  var minSize = clamp(base * 0.28, 12, maxSize * 0.42);

  var out = layout(list, W, H, maxSize, minSize);
  var tries = 0;
  while (out.length < list.length && tries < 3){
    maxSize *= 0.80;
    minSize = Math.max(11, minSize * 0.86);
    out = layout(list, W, H, maxSize, minSize);
    tries++;
  }

  // 詞太多時畫面塞不下所有詞，明講放進去幾個，不要默默吞掉
  $('stats').textContent = '共 ' + entries.length + ' 筆投稿 · ' + counts.size + ' 個不同的詞'
    + (out.length < counts.size ? '（畫面放得下最熱門的 ' + out.length + ' 個）' : '');

  var seen = new Set();
  out.forEach(function(w, rank){
    seen.add(w.text);
    var el = nodes.get(w.text);
    var fresh = false;
    if (!el){
      el = document.createElement('div');
      el.className = 'word enter';
      el.textContent = w.text;
      cloudEl.appendChild(el);
      nodes.set(w.text, el);
      fresh = true;
    }
    // 每次重排都重算顏色，票數竄升的詞才會跟著晉升成品牌紅
    el.style.color = colorFor(w.text, w.t, rank);
    el.classList.toggle('v', w.vertical);
    el.style.left = Math.round(w.x) + 'px';
    el.style.top = Math.round(w.y) + 'px';
    el.style.fontSize = (Math.round(w.size * 10) / 10) + 'px';
    el.style.fontWeight = String(w.weight);
    // 淺色紙底上透明度不能拉太低，否則小字在投影機上會糊掉。
    // 層次已經靠字級（37→128px）與字重（500→900）拉開了，透明度只做微幅收尾。
    el.style.opacity = String(clamp(0.85 + w.t * 0.15, 0.85, 1));
    el.title = w.text + ' — ' + w.n + ' 票';
    if (fresh){
      // 用 setTimeout 而非 requestAnimationFrame：分頁在背景時 rAF 會被凍結，
      // 那會讓新詞永遠卡在 opacity:0 的進場狀態。
      setTimeout(function(){ el.classList.remove('enter'); }, 30);
    } else if (highlight && highlight.has(w.text)){
      el.classList.remove('pop');
      void el.offsetWidth;
      el.classList.add('pop');
    }
  });

  nodes.forEach(function(el, text){
    if (!seen.has(text)){
      el.classList.add('enter');
      setTimeout(function(){ el.remove(); }, 520);
      nodes.delete(text);
    }
  });
}

/* 全班同時送出時，把連續進來的投稿合併成一次重排。
   重排是整張畫面重算，詞多的時候單次要兩三百毫秒，逐筆重排會卡。 */
var renderTimer = null, pendingHighlight = new Set();
function scheduleRender(highlight){
  if (highlight) highlight.forEach(function(w){ pendingHighlight.add(w); });
  if (renderTimer) return;
  renderTimer = setTimeout(function(){
    renderTimer = null;
    var h = pendingHighlight;
    pendingHighlight = new Set();
    render(h);
  }, 160);
}

/* ============================================================
   資料
   ============================================================ */
function addLocal(word){
  var id = 'L' + Date.now() + Math.random().toString(36).slice(2, 7);
  entries.push({ id: id, word: word });
  return id;
}

function submitWords(raw){
  var parts = raw.split(/[,，、\n\r]+/)
    .map(function(s){ return s.trim().replace(/\s+/g, ' '); })
    .filter(function(s){ return s.length > 0 && s.length <= 30; });
  if (!parts.length) return Promise.resolve();
  if (parts.length > 10) parts = parts.slice(0, 10);

  var fresh = new Set(parts);
  var done = function(){
    refreshUndo();
    render(fresh);
    toast(parts.length > 1 ? ('已加入 ' + parts.length + ' 個詞') : ('已加入「' + parts[0] + '」'));
  };

  if (online){
    var rows = parts.map(function(w){ return { room: room, word: w }; });
    return sb.from(TABLE).insert(rows).select('id,word').then(function(res){
      if (res.error){ toast('送出失敗：' + res.error.message, true); return; }
      (res.data || []).forEach(function(r){
        if (!entries.some(function(e){ return String(e.id) === String(r.id); })) entries.push(r);
        mine.push(r.id);
      });
      mineSave();
      done();
    });
  }
  parts.forEach(function(w){ mine.push(addLocal(w)); });
  mineSave();
  localSave();
  done();
  return Promise.resolve();
}

function undoLast(){
  if (!mine.length) return;
  var id = mine[mine.length - 1];
  var target = entries.filter(function(e){ return String(e.id) === String(id); })[0];
  var finish = function(){
    entries = entries.filter(function(e){ return String(e.id) !== String(id); });
    mine.pop(); mineSave();
    if (!online) localSave();
    refreshUndo();
    render();
    toast(target ? ('已撤回「' + target.word + '」') : '已撤回');
  };
  if (online && String(id).charAt(0) !== 'L'){
    sb.from(TABLE).delete().eq('id', id).then(function(res){
      if (res.error){ toast('撤回失敗：' + res.error.message, true); return; }
      finish();
    });
  } else {
    finish();
  }
}

function clearRoom(){
  if (!confirm('確定要清空主題「' + room + '」的所有詞彙嗎？\n這個動作無法復原。')) return;
  var finish = function(){
    entries = []; mine = []; mineSave();
    if (!online) localSave();
    refreshUndo();
    render();
    toast('已清空');
  };
  if (online){
    sb.from(TABLE).delete().eq('room', room).then(function(res){
      if (res.error){ toast('清空失敗：' + res.error.message, true); return; }
      finish();
    });
  } else {
    finish();
  }
}

function fetchAll(){
  // 由新到舊取最多 MAX_ROWS 筆：萬一某個主題累積超過上限，
  // 留下的會是最近的投稿，而不是被凍結在最早的那一批。
  return sb.from(TABLE).select('id,word')
    .eq('room', room).order('id', { ascending: false }).limit(MAX_ROWS)
    .then(function(res){
      if (res.error) throw res.error;
      entries = (res.data || []).reverse();
    });
}

function connect(){
  if (!window.supabase || !window.supabase.createClient){
    return Promise.reject(new Error('Supabase SDK 未載入'));
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    realtime: { params: { eventsPerSecond: 20 } }
  });
  return fetchAll().then(function(){
    online = true;
    sb.channel('wordcloud:' + room)
      .on('postgres_changes',
        { event: 'INSERT', schema: 'public', table: TABLE, filter: 'room=eq.' + room },
        function(payload){
          var r = payload['new'];
          if (!r || entries.some(function(e){ return String(e.id) === String(r.id); })) return;
          entries.push({ id: r.id, word: r.word });
          refreshUndo();
          scheduleRender(new Set([r.word]));
        })
      .on('postgres_changes',
        { event: 'DELETE', schema: 'public', table: TABLE },
        function(){
          // DELETE 事件在預設 replica identity 下只帶主鍵、也吃不到 room 過濾，
          // 所以直接重抓一次最準。
          fetchAll().then(function(){ refreshUndo(); scheduleRender(); }).catch(function(){});
        })
      .subscribe(function(st){
        if (st === 'SUBSCRIBED') setStatus('已連線 · 即時同步', true);
        else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT') setStatus('同步中斷，重新整理可修復', false);
      });
    setStatus('已連線 · 即時同步', true);
  });
}

/* ============================================================
   QR Code
   ============================================================ */
function shareUrl(){
  var u = new URL(location.href);
  u.search = (room && room !== 'default') ? ('?room=' + encodeURIComponent(room)) : '';
  u.hash = '';
  return u.toString();
}
var qrDrawnFor = null;
function fallbackQr(url){
  var img = new Image();
  img.alt = 'QR Code';
  img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=440x440&data=' + encodeURIComponent(url);
  var frame = $('qrFrame');
  frame.innerHTML = '';
  frame.appendChild(img);
}
function drawQr(){
  var url = shareUrl();
  var frame = $('qrFrame');

  if (location.protocol === 'file:'){
    $('qrUrl').textContent = '（目前是用本機檔案開啟，還沒有可分享的網址。部署到網路上之後，這裡會自動變成真正的網址。）';
    frame.innerHTML = '<div class="qr-note">部署到網路上之後<br>這裡會自動長出 QR Code</div>';
    return;
  }

  $('qrUrl').textContent = url;
  if (qrDrawnFor === url) return;

  if (window.QRCode){
    try {
      frame.innerHTML = '';
      new QRCode(frame, {
        text: url, width: 440, height: 440,
        colorDark: '#2B2523', colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });
      qrDrawnFor = url;
      return;
    } catch (e){ /* 落到下面的備援 */ }
  }
  fallbackQr(url);
  qrDrawnFor = url;
}

/* ============================================================
   介面事件
   ============================================================ */
$('wordForm').addEventListener('submit', function(e){
  e.preventDefault();
  var input = $('wordInput');
  var val = input.value.trim();
  if (!val){ input.focus(); return; }
  input.value = '';
  input.focus();
  submitWords(val);
});

$('toggleCloud').addEventListener('click', function(){
  cloudVisible = !cloudVisible;
  cloudEl.classList.toggle('is-hidden', !cloudVisible);
  this.textContent = cloudVisible ? '隱藏文字雲' : '顯示文字雲';
  render();
  if (cloudVisible) setTimeout(render, 60);
});

$('toggleQr').addEventListener('click', function(){
  var p = $('qrPanel');
  p.classList.toggle('show');
  if (p.classList.contains('show')) drawQr();
});
$('closeQr').addEventListener('click', function(){ $('qrPanel').classList.remove('show'); });
$('copyUrl').addEventListener('click', function(){
  var url = shareUrl();
  if (navigator.clipboard && location.protocol !== 'file:'){
    navigator.clipboard.writeText(url).then(
      function(){ toast('網址已複製'); },
      function(){ toast('複製失敗，請手動選取下方網址', true); });
  } else {
    toast('請手動選取下方網址複製', true);
  }
});

$('projectBtn').addEventListener('click', function(){
  document.body.classList.toggle('project');
  var on = document.body.classList.contains('project');
  this.textContent = on ? '離開投影' : '投影模式';
  if (on && document.documentElement.requestFullscreen){
    document.documentElement.requestFullscreen().catch(function(){});
  } else if (!on && document.fullscreenElement && document.exitFullscreen){
    document.exitFullscreen().catch(function(){});
  }
  setTimeout(render, 340);
});

$('undoBtn').addEventListener('click', undoLast);

if (isAdmin){
  $('adminBar').style.display = 'flex';
  $('roomInput').value = room;
  $('clearBtn').addEventListener('click', clearRoom);
  $('roomGo').addEventListener('click', function(){
    var v = $('roomInput').value.trim().slice(0, 40) || 'default';
    location.search = '?room=' + encodeURIComponent(v) + '&admin=1';
  });
}

document.addEventListener('keydown', function(e){
  if (e.key === 'Escape') $('qrPanel').classList.remove('show');
});

var resizeTimer;
window.addEventListener('resize', function(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function(){ render(); }, 220);
});

// 分頁被切到背景時瀏覽器會凍結動畫，回到前景時把殘留的進場狀態清掉並重排，
// 避免出現「明明有詞卻一片空白」的情況。
document.addEventListener('visibilitychange', function(){
  if (!document.hidden){
    nodes.forEach(function(el){ el.classList.remove('enter'); });
    render();
  }
});

/* ============================================================
   啟動
   ============================================================ */
$('roomChip').innerHTML = '主題：<b></b>';
$('roomChip').querySelector('b').textContent = room;
document.title = (room === 'default') ? '互動文字雲' : ('互動文字雲 · ' + room);

function boot(){
  if (booted) return;
  booted = true;
  render();
  drawQr();
  connect().then(function(){
    refreshUndo();
    render();
  }).catch(function(err){
    online = false;
    entries = localLoad();
    setStatus('離線模式（只存在這台裝置）', false);
    refreshUndo();
    render();
    console.warn('Supabase 連線失敗，改用本機模式：', err);
  });
}

if (document.fonts && document.fonts.ready){
  document.fonts.ready.then(boot);
  setTimeout(boot, 2500);
} else {
  boot();
}

})();
</script>
