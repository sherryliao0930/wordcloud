<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>互動文字雲</title>
<meta name="description" content="大家一起輸入詞彙，即時長出一朵文字雲。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    /* 品牌色系：奶油紙底 × 印章紅 × 明體 */
    --paper:#F6F0E6;        /* 主背景，暖奶油 */
    --paper-2:#FDFAF3;      /* 紙面（舞台、卡片） */
    --ink:#2B2523;          /* 主文字，暖黑 */
    --ink-soft:#6E6258;     /* 次要文字 */
    --ink-faint:#94867A;    /* 更淡的說明文字 */
    --brand:#A61B22;        /* 品牌紅（印章紅） */
    --brand-deep:#7C1015;   /* 深酒紅 */
    --brand-tint:#F3E3DC;   /* 淡紅底 */
    --line:#E2D7C6;         /* 分隔線 */
    --line-soft:#EFE7DA;
    --jade:#2E7D5B;         /* 連線中 */
    --amber:#B0761F;        /* 離線 */
    --serif:"Noto Serif TC","Songti TC","PMingLiU","Times New Roman",serif;
    --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;font-family:var(--sans);color:var(--ink);
    background:
      radial-gradient(900px 520px at 8% -8%, #FBF6EE 0%, transparent 62%),
      radial-gradient(760px 480px at 96% 4%, #F5E9DC 0%, transparent 60%),
      radial-gradient(900px 600px at 50% 118%, #F1E6D4 0%, transparent 58%),
      var(--paper);
    background-attachment:fixed;
    overflow:hidden;
  }

  .app{height:100dvh;display:flex;flex-direction:column;gap:12px;padding:16px clamp(12px,2.6vw,30px) 0}

  /* ---------- 上方刊頭 ---------- */
  .topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;flex:0 0 auto}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}

  /* 紅色方印 */
  .mark{
    display:grid;place-items:center;flex:0 0 auto;width:46px;height:46px;
    background:var(--brand);color:#fff;border-radius:5px;
    font-family:var(--serif);font-weight:700;font-size:25px;line-height:1;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.30), 0 4px 12px -6px rgba(124,16,21,.75);
  }
  .titles{display:flex;flex-direction:column;gap:2px;min-width:0}
  .kicker{
    font-size:10.5px;font-weight:700;color:var(--ink-soft);
    letter-spacing:.26em;text-transform:uppercase;white-space:nowrap;
  }
  .brand h1{
    font-family:var(--serif);font-size:clamp(20px,2.3vw,27px);font-weight:700;
    margin:0;letter-spacing:.10em;color:var(--ink);white-space:nowrap;line-height:1.15;
  }
  .rule{width:1px;height:30px;background:var(--brand);opacity:.42;flex:0 0 auto}
  .subtitle{
    font-family:var(--serif);font-size:15px;color:var(--brand);
    letter-spacing:.14em;white-space:nowrap;font-weight:500;
  }

  .live-dot{width:8px;height:8px;border-radius:50%;background:var(--jade);flex:0 0 auto;
    box-shadow:0 0 0 0 rgba(46,125,91,.55);animation:pulse 2.4s infinite}
  .live-dot.off{background:var(--amber);animation:none}
  @keyframes pulse{70%{box-shadow:0 0 0 8px rgba(46,125,91,0)}100%{box-shadow:0 0 0 0 rgba(46,125,91,0)}}

  .chip{
    display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:999px;
    background:var(--brand-tint);border:1px solid #E7CFC6;color:var(--brand-deep);
    font-size:12.5px;white-space:nowrap;max-width:44vw;overflow:hidden;text-overflow:ellipsis
  }
  .chip b{font-weight:700}
  .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

  .btn{
    appearance:none;border:1px solid var(--line);background:#FFFDF8;color:var(--ink);
    font-family:inherit;font-size:14px;font-weight:700;padding:9px 16px;border-radius:6px;cursor:pointer;
    transition:transform .12s ease,background .18s ease,border-color .18s ease,color .18s ease;
    white-space:nowrap;-webkit-tap-highlight-color:transparent;
  }
  .btn:hover{background:#fff;border-color:#D2C3AC}
  .btn:active{transform:translateY(1px)}
  .btn.primary{
    background:var(--brand);border-color:var(--brand);color:#fff;
    box-shadow:0 4px 12px -6px rgba(124,16,21,.75)
  }
  .btn.primary:hover{background:var(--brand-deep);border-color:var(--brand-deep)}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--ink-soft)}
  .btn.ghost:hover{background:rgba(0,0,0,.04);border-color:transparent}
  .btn.danger{background:#fff;border-color:#DDB3AE;color:var(--brand)}
  .btn.danger:hover{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  /* ---------- 舞台（紙面） ---------- */
  .stage{
    position:relative;flex:1 1 auto;min-height:0;border-radius:6px;
    background:var(--paper-2);border:1px solid var(--line);
    box-shadow:0 1px 0 #fff inset, 0 20px 44px -34px rgba(80,52,36,.55);
    overflow:hidden;
  }
  .stage::after{ /* 內框，印刷版面感 */
    content:'';position:absolute;inset:9px;border:1px solid var(--line-soft);
    border-radius:3px;pointer-events:none;
  }
  .cloud{position:absolute;inset:0;overflow:hidden;transition:opacity .45s ease,filter .45s ease}
  .cloud.is-hidden{opacity:0;pointer-events:none;filter:blur(12px)}

  .word{
    position:absolute;left:0;top:0;font-family:var(--serif);line-height:1.06;white-space:nowrap;
    cursor:default;user-select:none;letter-spacing:.01em;
    transition:left .65s cubic-bezier(.22,1,.36,1),top .65s cubic-bezier(.22,1,.36,1),
               font-size .65s cubic-bezier(.22,1,.36,1),color .5s ease,
               opacity .45s ease,transform .5s cubic-bezier(.34,1.56,.64,1);
  }
  .word.v{writing-mode:vertical-rl;text-orientation:upright;line-height:1.04}
  .word.enter{opacity:0 !important;transform:scale(.25)}
  .word.pop{animation:pop .7s cubic-bezier(.34,1.56,.64,1)}
  @keyframes pop{0%{filter:brightness(1.45) saturate(1.5)}100%{filter:none}}

  .overlay{
    position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    flex-direction:column;gap:14px;text-align:center;padding:28px;
  }
  .overlay.show{display:flex}
  .overlay .big{font-family:var(--serif);font-size:clamp(21px,3.4vw,34px);font-weight:700;
    color:var(--ink);letter-spacing:.08em}
  .overlay .sub{color:var(--ink-soft);font-size:15px;max-width:44ch;line-height:1.85}
  .counter{
    font-family:var(--serif);font-size:clamp(52px,12vw,148px);font-weight:700;line-height:1;
    color:var(--brand);letter-spacing:.02em;
  }

  /* ---------- 輸入區 ---------- */
  .composer{flex:0 0 auto;padding:0 0 16px}
  .composer form{display:flex;gap:10px}
  .composer input{
    flex:1;min-width:0;font-family:inherit;font-size:17px;font-weight:500;color:var(--ink);
    background:#FFFDF8;border:1px solid var(--line);border-radius:6px;padding:14px 16px;
    transition:border-color .18s,box-shadow .18s;
  }
  .composer input::placeholder{color:var(--ink-faint)}
  .composer input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(166,27,34,.10)}
  .composer form .btn{padding:0 24px;font-size:16px}
  .metabar{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    margin-top:10px;font-size:12.5px;color:var(--ink-soft);min-height:20px
  }
  .metabar .sep{opacity:.4}
  .link{background:none;border:none;color:var(--brand);font:inherit;font-size:12.5px;
    cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
  .link:hover{color:var(--brand-deep)}
  .link:disabled{opacity:.4;cursor:not-allowed;text-decoration:none;color:var(--ink-faint)}

  /* ---------- 關鍵字確認面板 ---------- */
  .suggest{
    margin-bottom:12px;padding:15px 16px 14px;border-radius:8px;
    background:var(--paper-2);border:1px solid var(--line);
    box-shadow:0 14px 34px -26px rgba(80,52,36,.75);
  }
  .suggest[hidden]{display:none}
  .suggest-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .suggest-title{font-family:var(--serif);font-size:15.5px;font-weight:700;
    color:var(--ink);letter-spacing:.06em}
  .suggest-hint{font-size:12.5px;color:var(--ink-soft)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;max-height:34vh;overflow-y:auto}
  .chip-word{
    appearance:none;font-family:var(--serif);font-size:15px;font-weight:700;cursor:pointer;
    padding:8px 15px;border-radius:999px;letter-spacing:.04em;
    background:var(--brand);border:1px solid var(--brand);color:#fff;
    transition:background .16s,color .16s,border-color .16s;
    -webkit-tap-highlight-color:transparent;
  }
  .chip-word:hover{background:var(--brand-deep);border-color:var(--brand-deep)}
  .chip-word.off{background:transparent;border-color:var(--line);color:var(--ink-faint);
    text-decoration:line-through}
  .chip-word.off:hover{background:var(--paper);border-color:#D2C3AC;color:var(--ink-soft)}
  .suggest-actions{display:flex;gap:9px;align-items:center}
  .suggest-actions .btn{padding:9px 20px}
  .suggest-count{margin-left:auto;font-size:12.5px;color:var(--ink-soft)}

  /* ---------- QR 面板 ---------- */
  .qr{
    position:fixed;right:clamp(12px,2.6vw,30px);bottom:clamp(12px,2.6vw,30px);z-index:40;
    width:min(340px,88vw);background:var(--paper-2);border:1px solid var(--line);border-radius:8px;
    padding:20px;box-shadow:0 26px 60px -30px rgba(80,52,36,.6);text-align:center;
    transform:translateY(18px) scale(.96);opacity:0;pointer-events:none;
    transition:.28s cubic-bezier(.22,1,.36,1);
  }
  .qr.show{transform:none;opacity:1;pointer-events:auto}
  .qr h3{margin:0 0 5px;font-family:var(--serif);font-size:17px;font-weight:700;
    color:var(--brand);letter-spacing:.14em}
  .qr p{margin:0 0 14px;font-size:12.5px;color:var(--ink-soft);letter-spacing:.03em}
  .qr .frame{appearance:none;margin:0;font:inherit;
    background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px;
    display:block;line-height:0;width:100%;cursor:zoom-in;
    transition:border-color .18s,box-shadow .18s;-webkit-tap-highlight-color:transparent}
  .qr .frame:hover{border-color:var(--brand);box-shadow:0 0 0 3px rgba(166,27,34,.10)}
  .qr-code{width:100%;max-width:100%;height:auto;display:block;border-radius:2px}
  .qr-note{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    color:var(--ink-faint);font-size:13px;line-height:1.8;text-align:center;padding:16px}

  /* 放大檢視：投影時讓全班一起掃 */
  .qr-big{position:fixed;inset:0;z-index:80;background:rgba(20,14,12,.86);
    display:flex;align-items:center;justify-content:center;padding:4vmin}
  .qr-big[hidden]{display:none}
  .qr-big-inner{display:flex;flex-direction:column;align-items:center;gap:16px}
  .qr-big-frame{background:#fff;border-radius:10px;padding:2vmin;line-height:0}
  .qr-big-frame .qr-code{width:min(78vmin,820px);height:auto}
  .qr-big-url{color:#fff;font-size:clamp(13px,2.2vmin,19px);letter-spacing:.03em;
    word-break:break-all;text-align:center;max-width:76vmin;opacity:.92}
  #qrBigClose{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff}
  #qrBigClose:hover{background:rgba(255,255,255,.24)}
  .qr .url{
    margin-top:13px;font-size:11.5px;color:var(--ink-soft);word-break:break-all;line-height:1.6;
    background:var(--paper);border:1px solid var(--line-soft);border-radius:5px;padding:8px 10px;
  }
  .qr .row{display:flex;gap:8px;margin-top:11px}
  .qr .row .btn{flex:1;padding:8px 10px;font-size:13px}

  /* ---------- 管理列 ---------- */
  .admin{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:11px;
    padding:9px 13px;border-radius:6px;
    background:var(--brand-tint);border:1px dashed #D6ADA6;
    font-size:12.5px;color:var(--brand-deep);font-weight:700
  }
  .admin input{
    font-family:inherit;font-size:13px;font-weight:500;color:var(--ink);background:#fff;
    border:1px solid #E0C6BE;border-radius:5px;padding:6px 10px;width:150px
  }
  .admin input:focus{outline:none;border-color:var(--brand)}
  .admin .btn{padding:6px 12px;font-size:13px}
  .admin .grow{margin-left:auto}

  /* ---------- 提示 ---------- */
  .toast{
    position:fixed;left:50%;bottom:28px;transform:translate(-50%,26px);z-index:60;
    background:var(--ink);border:1px solid rgba(0,0,0,.1);color:var(--paper);
    font-size:14px;font-weight:700;letter-spacing:.04em;
    padding:12px 20px;border-radius:6px;box-shadow:0 18px 40px -20px rgba(43,37,35,.7);
    opacity:0;pointer-events:none;transition:.26s ease
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.warn{background:var(--brand-deep);border-color:var(--brand-deep)}

  /* ---------- 學生端 / 管理端分流 ---------- */
  .student-only{display:none}
  body.is-student .student-only{display:block}
  body.is-student .admin-only{display:none}
  body.is-student .actions,body.is-student .admin{display:none}
  /* 學生只有一件事要做：把想法打進去，所以輸入框放大 */
  body.is-student .composer input{font-size:18px;padding:16px 18px}
  body.is-student .composer form .btn{padding:0 26px;font-size:17px}

  /* 揭曉鈕：已揭曉時轉成墨色，狀態一眼可辨 */
  .btn.reveal{letter-spacing:.06em}
  .btn.reveal.on{background:var(--ink);border-color:var(--ink);color:var(--paper);
    box-shadow:0 4px 12px -6px rgba(43,37,35,.7)}
  .btn.reveal.on:hover{background:#3D3532;border-color:#3D3532}

  /* ---------- 投影模式 ---------- */
  body.project .composer,body.project .admin{display:none}
  body.project .topbar{opacity:.3;transition:opacity .3s}
  body.project .topbar:hover{opacity:1}
  body.project .stage{margin-bottom:16px}

  /* 平板直式（iPad 768px）放不下「刊頭 ＋ 四顆按鈕」一整排，讓工具列自己佔一列 */
  @media (max-width:980px){
    .actions{width:100%;margin-left:0}
    .actions .btn{flex:1 1 auto}
  }
  @media (max-width:820px){
    .rule,.subtitle{display:none}
  }
  @media (max-width:720px){
    .app{padding:12px 12px 0;gap:10px}
    .mark{width:38px;height:38px;font-size:21px;border-radius:4px}
    .brand h1{font-size:19px;letter-spacing:.06em}
    .kicker{font-size:9.5px;letter-spacing:.2em}
    .actions{width:100%;margin-left:0}
    /* 不平均拉伸：按鈕數量會變（揭曉後「預覽」會收起來），
       硬拉的話最後一列常常只剩一顆被拉成通欄，很難看。用自然寬度換行就好。 */
    .actions .btn{flex:0 1 auto;padding:9px 12px;font-size:13px}
    .composer input{font-size:16px;padding:13px 14px}
    .composer form .btn{padding:0 18px}
    /* 固定 150px 在手機上會被擠成看不見內容，讓它吃掉該列剩下的寬度 */
    .admin input{flex:1 1 90px;width:auto;min-width:0}
    .admin .grow{margin-left:0}
    .qr{left:12px;right:12px;width:auto}
  }
  /* 觸控裝置（平板／手機）：把點擊區拉到手指按得準的高度。
     只動 min-height，不碰 padding，才不會跟上面各斷點的尺寸打架。 */
  @media (pointer:coarse){
    .btn{min-height:44px}
    .composer input,.composer form .btn{min-height:54px}
    .admin .btn,.admin input{min-height:40px}
    .link{display:inline-block;padding:7px 0}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important}
  }
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="mark" aria-hidden="true">雲</span>
      <div class="titles">
        <span class="kicker">Word Cloud</span>
        <h1>互動文字雲</h1>
      </div>
      <span class="rule" aria-hidden="true"></span>
      <span class="subtitle">課堂即時共創</span>
      <span class="live-dot" id="liveDot" title="連線狀態"></span>
      <span class="chip" id="roomChip">主題：<b>—</b></span>
    </div>
    <div class="actions">
      <button class="btn primary reveal" id="revealBtn">一鍵揭曉</button>
      <button class="btn" id="previewBtn">預覽</button>
      <button class="btn" id="toggleQr">QR Code</button>
      <button class="btn" id="exportBtn">下載 Excel</button>
      <button class="btn" id="projectBtn">投影模式</button>
    </div>
  </header>

  <main class="stage">
    <div class="cloud" id="cloud"></div>

    <div class="overlay" id="emptyState">
      <div class="big">還沒有任何詞彙</div>
      <div class="sub admin-only">在下面的輸入框打一個詞、按 Enter，它就會浮上來。<br>同一個詞被越多人送出，字就會長得越大。</div>
      <div class="sub student-only">在下面打下你的想法，按 Enter 送出。</div>
    </div>

    <div class="overlay" id="hiddenState">
      <div class="sub admin-only">目前已收集</div>
      <div class="sub student-only">大家已經送出</div>
      <div class="counter" id="hiddenCount">0</div>
      <div class="sub admin-only">學生端現在還看不到文字雲。<br>按上方「一鍵揭曉」，全班的畫面會同時亮起來。</div>
      <div class="sub student-only">你的想法已經收到了。<br>等老師按下揭曉，大家的文字雲就會出現。</div>
    </div>
  </main>

  <section class="composer">
    <div class="admin" id="adminBar" style="display:none">
      <span>主題名稱</span>
      <input id="roomInput" placeholder="例如：六年一班" maxlength="40">
      <button class="btn" id="roomGo">切換主題</button>
      <button class="btn danger grow" id="clearBtn">清空這個主題</button>
    </div>
    <div class="suggest" id="suggestPanel" hidden>
      <div class="suggest-head">
        <span class="suggest-title">字數比較多，先幫你抓出關鍵字</span>
        <span class="suggest-hint">點一下可以取消不要的。帶入輸入框後還能修改，按「加入」才會送出</span>
      </div>
      <div class="chips" id="suggestChips"></div>
      <div class="suggest-actions">
        <button class="btn primary" id="suggestAdd" type="button">帶入輸入框</button>
        <button class="btn ghost" id="suggestCancel" type="button">取消</button>
        <span class="suggest-count" id="suggestCount"></span>
      </div>
    </div>

    <form id="wordForm" autocomplete="off">
      <input id="wordInput" maxlength="200" placeholder="輸入詞彙，用逗號分隔" enterkeyhint="send">
      <button class="btn primary" type="submit">加入</button>
    </form>
    <div class="metabar">
      <span id="stats">載入中…</span>
      <span class="sep">·</span>
      <span id="statusText">連線中…</span>
      <span class="sep">·</span>
      <button class="link" id="undoBtn" disabled>撤回我上一個詞</button>
    </div>
  </section>
</div>

<aside class="qr" id="qrPanel">
  <h3>掃我一起加入</h3>
  <p>手機掃描後就能輸入詞彙 · 點圖可放大</p>
  <button class="frame" id="qrFrame" type="button" title="點一下放大，方便全班一起掃">
    <div class="qr-note">產生中…</div>
  </button>
  <div class="url" id="qrUrl">—</div>
  <div class="row">
    <button class="btn" id="copyUrl">複製網址</button>
    <button class="btn ghost" id="closeQr">關閉</button>
  </div>
</aside>

<div class="qr-big" id="qrBig" hidden>
  <div class="qr-big-inner">
    <div class="qr-big-frame" id="qrBigFrame"></div>
    <div class="qr-big-url" id="qrBigUrl"></div>
    <button class="btn" id="qrBigClose" type="button">關閉</button>
  </div>
</div>

<div class="toast" id="toast"></div>

function extractKeywords(raw){
  var text = String(raw || '').trim();
  if (!text) return [];

  var pieces = [];
  if (window.Intl && Intl.Segmenter){
    var seg = new Intl.Segmenter('zh-Hant', { granularity: 'word' });
    Array.from(seg.segment(text)).forEach(function(s){
      if (!s.isWordLike) return;
      var w = s.segment.trim();
      if (!w || STOPWORDS.has(w.toLowerCase())) return;
      pieces.push({ text: w, start: s.index, end: s.index + s.segment.length });
    });
  } else {
    // 舊瀏覽器沒有 Segmenter：退而求其次，只靠標點與空白切
    var pos = 0;
    text.split(/([\s,，、。．.!！?？;；:：「」『』（）()\[\]【】—…~～\-_/\\|"'`]+)/).forEach(function(chunk){
      var start = pos; pos += chunk.length;
      var w = chunk.trim();
      if (!w || STOPWORDS.has(w.toLowerCase())) return;
      pieces.push({ text: w, start: start, end: start + chunk.length });
    });
  }

  var merged = mergeAdjacent(pieces);
  var out = [], seen = new Set();
  merged.forEach(function(w){
    w = w.trim();
    if (!w || w.length > 30) return;
    if (!HAS_LETTER_RE.test(w)) return;                 // 純數字、純標點不要
    if (w.length === 1 && CJK_RE.test(w)) return;       // 落單的單字通常不成詞
    if (STOPWORDS.has(w.toLowerCase())) return;         // 合併後可能又變成停用詞
    var key = w.toLowerCase();
    if (seen.has(key)) return;
    seen.add(key);
    out.push(w);
  });
  return out.slice(0, MAX_SUGGEST);
}

/* 這個網站以「詞」為主：用逗號分隔的輸入就照原樣送出，不多問一道。
   只有當某一段超過 LONG_INPUT 個字時（那多半是一句話而不是一個詞），
   才先拆成關鍵字讓使用者挑。

   門檻是逐段檢查而不是看整串長度 —— 「合作，溝通，耐心，尊重」有 11 個字，
   但每一段都是乾淨的詞，不該被攔下來多按一次。 */
var LONG_INPUT = 8;

function isOneWord(part){
  var t = part.trim();
  if (!t) return true;
  if (/^[A-Za-z][A-Za-z''-]*$/.test(t)) return t.length <= 30;  // 單一英文字可以長一點
  return t.length <= LONG_INPUT;
}

function needsExtraction(raw){
  return String(raw).split(/[,，、\n\r]+/).some(function(p){ return !isOneWord(p); });
}

/* ============================================================
   排版：由大到小，沿阿基米德螺線找不重疊的位置
   ============================================================ */
/* 字重跟著票數走：越熱門的詞越粗，做出刊物標題的層次感。
   量測用的字型與字重必須跟實際渲染完全一致，否則碰撞偵測會失準。 */
function weightFor(t){ return t > 0.66 ? 900 : (t > 0.30 ? 700 : 500); }

function measure(text, size, vertical, weight){
  var pad = Math.max(3, size * 0.10);
  var w, h;
  if (vertical){
    w = size * 1.12;
    h = size * 1.06 * text.length;
  } else {
    measurer.font = weight + ' ' + size + 'px "Noto Serif TC","Songti TC",serif';
    w = measurer.measureText(text).width;
    h = size * 1.16;
  }
  return { w: w + pad * 2, h: h + pad * 2, pad: pad };
}

function hits(box, placed){
  for (var i = 0; i < placed.length; i++){
    var p = placed[i];
    if (box.x < p.x + p.w && box.x + box.w > p.x &&
        box.y < p.y + p.h && box.y + box.h > p.y) return true;
  }
  return false;
}

function layout(list, W, H, maxSize, minSize, edge){
  var placed = [], result = [];
  var maxN = list[0].n, minN = list[list.length - 1].n;
  var span = Math.max(1, maxN - minN);
  var cx = W / 2, cy = H / 2;
  var aspect = W / H;
  var maxR = Math.sqrt(W * W + H * H) / 2;

  for (var i = 0; i < list.length; i++){
    var item = list[i];
    var t = (maxN === minN) ? 0.62 : (item.n - minN) / span;
    var size = minSize + (maxSize - minSize) * Math.pow(t, 0.62);
    var weight = weightFor(t);
    var vertical = isCJK(item.text) && item.text.length >= 2 && item.text.length <= 5 && (hash(item.text) % 5 === 0);

    var spot = null;
    for (var attempt = 0; attempt < 3 && !spot; attempt++){
      var s = size * (attempt === 0 ? 1 : (attempt === 1 ? 0.78 : 0.58));
      if (s < 10) break;
      var m = measure(item.text, s, vertical, weight);
      if (m.w > W - edge * 2 || m.h > H - edge * 2) continue;

      for (var step = 0; step < 5200; step++){
        var ang = step * 0.30;
        var r = 0.85 * ang;
        if (r > maxR * 1.2) break;
        var x = cx + r * Math.cos(ang) * (aspect > 1 ? aspect * 0.92 : 1) - m.w / 2;
        var y = cy + r * Math.sin(ang) * (aspect < 1 ? (1 / aspect) * 0.92 : 1) - m.h / 2;
        if (x < edge || y < edge || x + m.w > W - edge || y + m.h > H - edge) continue;
        var box = { x: x, y: y, w: m.w, h: m.h };
        if (!hits(box, placed)){
          placed.push(box);
          spot = { x: x + m.pad, y: y + m.pad, size: s, vertical: vertical };
          break;
        }
      }
    }
    if (spot) result.push({ text: item.text, n: item.n, x: spot.x, y: spot.y,
                            size: spot.size, vertical: spot.vertical, weight: weight, t: t });
  }
  return result;
}

/* ============================================================
   繪製
   ============================================================ */
function clearNodes(){
  nodes.forEach(function(el){ el.remove(); });
  nodes.clear();
}

/* 這台裝置該不該顯示文字雲。
   學生端只看全班共用的 revealed；管理端多一個自己的預覽開關。 */
function cloudShown(){ return revealed || (isAdmin && preview); }

/* 兩端看到的統計不同：學生只需要知道「大家送了幾個、我送了幾個」，
   詞數細節是老師在意的事，不該在揭曉前洩漏給學生。 */
function updateStats(counts, placed){
  var el = $('stats');
  if (!entries.length){
    el.textContent = isAdmin ? '還沒有人投稿' : '還沒有人送出想法';
    return;
  }
  if (!isAdmin){
    el.textContent = '全班已經送出 ' + entries.length + ' 個想法'
      + (mine.length ? '　·　你送出了 ' + mine.length + ' 個' : '');
    return;
  }
  el.textContent = '共 ' + entries.length + ' 筆投稿 · ' + counts.size + ' 個不同的詞'
    + (placed !== null && placed < counts.size
        ? '（畫面放得下最熱門的 ' + placed + ' 個）' : '');
}

function render(highlight){
  var counts = new Map();
  for (var i = 0; i < entries.length; i++){
    var w = entries[i].word;
    counts.set(w, (counts.get(w) || 0) + 1);
  }

  var list = [];
  counts.forEach(function(n, text){ list.push({ text: text, n: n }); });
  list.sort(function(a, b){ return b.n - a.n || a.text.localeCompare(b.text, 'zh-Hant'); });
  if (list.length > MAX_WORDS) list = list.slice(0, MAX_WORDS);

  var shown = cloudShown();
  updateStats(counts, null);
  $('hiddenCount').textContent = String(entries.length);
  $('emptyState').classList.toggle('show', list.length === 0 && shown);
  $('hiddenState').classList.toggle('show', !shown);

  // 還沒揭曉就不排版：學生手機不用白算，而且揭曉那一刻所有詞會一起飛進來
  if (!shown || !list.length){ clearNodes(); return; }

  var W = cloudEl.clientWidth, H = cloudEl.clientHeight;
  if (W < 40 || H < 40) return;

  // 四周留白，別讓字貼著框線。字級也依「扣掉留白後」的面積推估。
  var edge = clamp(Math.min(W, H) * 0.055, 16, 48);
  var iw = W - edge * 2, ih = H - edge * 2;

  var base = Math.sqrt((iw * ih) / Math.max(10, list.length));
  var maxSize = clamp(base * 1.05, 26, Math.min(iw * 0.46, ih * 0.42));
  var minSize = clamp(base * 0.28, 12, maxSize * 0.42);

  var out = layout(list, W, H, maxSize, minSize, edge);
  var tries = 0;
  while (out.length < list.length && tries < 3){
    maxSize *= 0.80;
    minSize = Math.max(11, minSize * 0.86);
    out = layout(list, W, H, maxSize, minSize, edge);
    tries++;
  }

  // 詞太多時畫面塞不下所有詞，明講放進去幾個，不要默默吞掉
  updateStats(counts, out.length);

  var seen = new Set();
  out.forEach(function(w, rank){
    seen.add(w.text);
    var el = nodes.get(w.text);
    var fresh = false;
    if (!el){
      el = document.createElement('div');
      el.className = 'word enter';
      el.textContent = w.text;
      cloudEl.appendChild(el);
      nodes.set(w.text, el);
      fresh = true;
    }
    // 每次重排都重算顏色，票數竄升的詞才會跟著晉升成品牌紅
    el.style.color = colorFor(w.text, w.t, rank);
    el.classList.toggle('v', w.vertical);
    el.style.left = Math.round(w.x) + 'px';
    el.style.top = Math.round(w.y) + 'px';
    el.style.fontSize = (Math.round(w.size * 10) / 10) + 'px';
    el.style.fontWeight = String(w.weight);
    // 淺色紙底上透明度不能拉太低，否則小字在投影機上會糊掉。
    // 層次已經靠字級（37→128px）與字重（500→900）拉開了，透明度只做微幅收尾。
    el.style.opacity = String(clamp(0.85 + w.t * 0.15, 0.85, 1));
    el.title = w.text + ' — ' + w.n + ' 票';
    if (fresh){
      // 用 setTimeout 而非 requestAnimationFrame：分頁在背景時 rAF 會被凍結，
      // 那會讓新詞永遠卡在 opacity:0 的進場狀態。
      setTimeout(function(){ el.classList.remove('enter'); }, 30);
    } else if (highlight && highlight.has(w.text)){
      el.classList.remove('pop');
      void el.offsetWidth;
      el.classList.add('pop');
    }
  });

  nodes.forEach(function(el, text){
    if (!seen.has(text)){
      el.classList.add('enter');
      setTimeout(function(){ el.remove(); }, 520);
      nodes.delete(text);
    }
  });
}

/* 全班同時送出時，把連續進來的投稿合併成一次重排。
   重排是整張畫面重算，詞多的時候單次要兩三百毫秒，逐筆重排會卡。 */
var renderTimer = null, pendingHighlight = new Set();
function scheduleRender(highlight){
  if (highlight) highlight.forEach(function(w){ pendingHighlight.add(w); });
  if (renderTimer) return;
  renderTimer = setTimeout(function(){
    renderTimer = null;
    var h = pendingHighlight;
    pendingHighlight = new Set();
    render(h);
  }, 160);
}

/* ============================================================
   資料
   ============================================================ */
function addLocal(word){
  var id = 'L' + Date.now() + Math.random().toString(36).slice(2, 7);
  entries.push({ id: id, word: word, created_at: new Date().toISOString() });
  return id;
}

function submitWords(raw){
  return submitList(String(raw).split(/[,，、\n\r]+/));
}

function submitList(list){
  var parts = list
    .map(function(s){ return String(s).trim().replace(/\s+/g, ' '); })
    .filter(function(s){ return s.length > 0 && s.length <= 30; });
  if (!parts.length) return Promise.resolve();
  if (parts.length > MAX_BATCH) parts = parts.slice(0, MAX_BATCH);

  var fresh = new Set(parts);
  var done = function(){
    refreshUndo();
    render(fresh);
    toast(parts.length > 1 ? ('已加入 ' + parts.length + ' 個詞') : ('已加入「' + parts[0] + '」'));
  };

  if (online){
    var rows = parts.map(function(w){ return { room: room, word: w }; });
    return sb.from(TABLE).insert(rows).select('id,word,created_at').then(function(res){
      if (res.error){ toast('送出失敗：' + res.error.message, true); return; }
      (res.data || []).forEach(function(r){
        if (!entries.some(function(e){ return String(e.id) === String(r.id); })) entries.push(r);
        mine.push(r.id);
      });
      mineSave();
      done();
    });
  }
  parts.forEach(function(w){ mine.push(addLocal(w)); });
  mineSave();
  localSave();
  done();
  return Promise.resolve();
}

function undoLast(){
  if (!mine.length) return;
  var id = mine[mine.length - 1];
  var target = entries.filter(function(e){ return String(e.id) === String(id); })[0];
  var finish = function(){
    entries = entries.filter(function(e){ return String(e.id) !== String(id); });
    mine.pop(); mineSave();
    if (!online) localSave();
    refreshUndo();
    render();
    toast(target ? ('已撤回「' + target.word + '」') : '已撤回');
  };
  if (online && String(id).charAt(0) !== 'L'){
    sb.from(TABLE).delete().eq('id', id).then(function(res){
      if (res.error){ toast('撤回失敗：' + res.error.message, true); return; }
      finish();
    });
  } else {
    finish();
  }
}

function clearRoom(){
  if (!confirm('確定要清空主題「' + room + '」的所有詞彙嗎？\n這個動作無法復原。')) return;
  var finish = function(){
    entries = []; mine = []; mineSave();
    if (!online) localSave();
    refreshUndo();
    render();
    toast('已清空');
  };
  if (online){
    sb.from(TABLE).delete().eq('room', room).then(function(res){
      if (res.error){ toast('清空失敗：' + res.error.message, true); return; }
      finish();
    });
  } else {
    finish();
  }
}

/* ---------- 揭曉狀態：全班共用，只有管理端能改 ---------- */
function syncView(){
  cloudEl.classList.toggle('is-hidden', !cloudShown());
  if (isAdmin){
    var rb = $('revealBtn');
    rb.textContent = revealed ? '收回文字雲' : '一鍵揭曉';
    rb.classList.toggle('on', revealed);
    var pb = $('previewBtn');
    pb.style.display = revealed ? 'none' : '';   // 已揭曉就不需要預覽了
    pb.textContent = preview ? '結束預覽' : '預覽';
  }
  render();
}

function setRevealed(v){
  revealed = v;
  if (v) preview = false;
  syncView();
  toast(v ? '已揭曉 · 全班的畫面同時出現文字雲' : '已收回 · 學生端看不到文字雲了');
  if (online){
    sb.from(ROOMS).upsert({ room: room, revealed: v, updated_at: new Date().toISOString() })
      .then(function(res){
        if (res.error) toast('揭曉狀態沒同步出去：' + res.error.message, true);
      });
  }
}

function fetchRoomState(){
  return sb.from(ROOMS).select('revealed').eq('room', room).maybeSingle()
    .then(function(res){
      if (res.error) throw res.error;
      revealed = !!(res.data && res.data.revealed);
    });
}

function fetchAll(){
  // 由新到舊取最多 MAX_ROWS 筆：萬一某個主題累積超過上限，
  // 留下的會是最近的投稿，而不是被凍結在最早的那一批。
  return sb.from(TABLE).select('id,word,created_at')
    .eq('room', room).order('id', { ascending: false }).limit(MAX_ROWS)
    .then(function(res){
      if (res.error) throw res.error;
      entries = (res.data || []).reverse();
    });
}

function connect(){
  if (!window.supabase || !window.supabase.createClient){
    return Promise.reject(new Error('Supabase SDK 未載入'));
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    realtime: { params: { eventsPerSecond: 20 } }
  });
  return Promise.all([fetchAll(), fetchRoomState()]).then(function(){
    online = true;
    sb.channel('wordcloud:' + room)
      .on('postgres_changes',
        { event: '*', schema: 'public', table: ROOMS, filter: 'room=eq.' + room },
        function(payload){
          // 老師在別台裝置按下揭曉，這裡就會收到
          var r = payload['new'];
          if (!r || !!r.revealed === revealed) return;
          revealed = !!r.revealed;
          if (revealed) preview = false;
          syncView();
          if (!isAdmin && revealed) toast('文字雲揭曉了！');
        })
      .on('postgres_changes',
        { event: 'INSERT', schema: 'public', table: TABLE, filter: 'room=eq.' + room },
        function(payload){
          var r = payload['new'];
          if (!r || entries.some(function(e){ return String(e.id) === String(r.id); })) return;
          entries.push({ id: r.id, word: r.word, created_at: r.created_at });
          refreshUndo();
          scheduleRender(new Set([r.word]));
        })
      .on('postgres_changes',
        { event: 'DELETE', schema: 'public', table: TABLE },
        function(){
          // DELETE 事件在預設 replica identity 下只帶主鍵、也吃不到 room 過濾，
          // 所以直接重抓一次最準。
          fetchAll().then(function(){ refreshUndo(); scheduleRender(); }).catch(function(){});
        })
      .subscribe(function(st){
        if (st === 'SUBSCRIBED') setStatus('已連線 · 即時同步', true);
        else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT') setStatus('同步中斷，重新整理可修復', false);
      });
    setStatus('已連線 · 即時同步', true);
  });
}

/* ============================================================
   匯出 Excel（.xlsx）

   xlsx 其實就是一包 ZIP 裝著幾個 XML。自己寫比拉 SheetJS 進來划算太多
   ——那個函式庫壓縮後將近 1MB，而這裡只需要「不壓縮」的 ZIP 加四個
   固定格式的 XML，兩百行就搞定，而且不必為了下載一份成績單多載一整包。
   ============================================================ */
var CRC_TABLE = (function(){
  var tbl = new Uint32Array(256);
  for (var n = 0; n < 256; n++){
    var c = n;
    for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    tbl[n] = c >>> 0;
  }
  return tbl;
})();

function crc32(bytes){
  var crc = 0xFFFFFFFF;
  for (var i = 0; i < bytes.length; i++){
    crc = CRC_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
  }
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

/* 只做 store（不壓縮）的 ZIP —— xlsx 完全接受，也省掉實作 deflate */
function makeZip(files){
  var enc = new TextEncoder();
  var parts = [], central = [], offset = 0;

  files.forEach(function(f){
    var name = enc.encode(f.name);
    var data = enc.encode(f.xml);
    var crc = crc32(data);

    var lh = new Uint8Array(30 + name.length);
    var d = new DataView(lh.buffer);
    d.setUint32(0, 0x04034b50, true);
    d.setUint16(4, 20, true);
    d.setUint16(6, 0x0800, true);   // 檔名用 UTF-8
    d.setUint16(8, 0, true);        // 不壓縮
    d.setUint16(10, 0, true);
    d.setUint16(12, 0x0021, true);  // 1980-01-01
    d.setUint32(14, crc, true);
    d.setUint32(18, data.length, true);
    d.setUint32(22, data.length, true);
    d.setUint16(26, name.length, true);
    d.setUint16(28, 0, true);
    lh.set(name, 30);
    parts.push(lh, data);

    var cd = new Uint8Array(46 + name.length);
    var c = new DataView(cd.buffer);
    c.setUint32(0, 0x02014b50, true);
    c.setUint16(4, 20, true);
    c.setUint16(6, 20, true);
    c.setUint16(8, 0x0800, true);
    c.setUint16(10, 0, true);
    c.setUint16(12, 0, true);
    c.setUint16(14, 0x0021, true);
    c.setUint32(16, crc, true);
    c.setUint32(20, data.length, true);
    c.setUint32(24, data.length, true);
    c.setUint16(28, name.length, true);
    c.setUint32(42, offset, true);
    cd.set(name, 46);
    central.push(cd);

    offset += lh.length + data.length;
  });

  var cdSize = central.reduce(function(a, b){ return a + b.length; }, 0);
  var eocd = new Uint8Array(22);
  var e = new DataView(eocd.buffer);
  e.setUint32(0, 0x06054b50, true);
  e.setUint16(8, files.length, true);
  e.setUint16(10, files.length, true);
  e.setUint32(12, cdSize, true);
  e.setUint32(16, offset, true);

  return new Blob(parts.concat(central, [eocd]),
    { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

function xmlEscape(s){
  return String(s).replace(/[&<>"']/g, function(ch){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&apos;' }[ch];
  }).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '');   // 控制字元會讓 Excel 拒開
}

function colName(i){
  var s = '';
  i += 1;
  while (i > 0){
    var r = (i - 1) % 26;
    s = String.fromCharCode(65 + r) + s;
    i = Math.floor((i - 1) / 26);
  }
  return s;
}

/* rows：二維陣列，數字寫成數值格、其餘寫成文字 */
function sheetXml(rows){
  var body = rows.map(function(row, r){
    var cells = row.map(function(v, c){
      var ref = colName(c) + (r + 1);
      if (typeof v === 'number' && isFinite(v)){
        return '<c r="' + ref + '"><v>' + v + '</v></c>';
      }
      return '<c r="' + ref + '" t="inlineStr"><is><t xml:space="preserve">' +
             xmlEscape(v == null ? '' : v) + '</t></is></c>';
    }).join('');
    return '<row r="' + (r + 1) + '">' + cells + '</row>';
  }).join('');

  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
    '<sheetData>' + body + '</sheetData></worksheet>';
}

function buildWorkbook(sheets){
  var files = [];

  files.push({ name: '[Content_Types].xml', xml:
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
    '<Default Extension="xml" ContentType="application/xml"/>' +
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
    sheets.map(function(s, i){
      return '<Override PartName="/xl/worksheets/sheet' + (i + 1) + '.xml" ' +
             'ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>';
    }).join('') +
    '</Types>' });

  files.push({ name: '_rels/.rels', xml:
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
    '</Relationships>' });

  files.push({ name: 'xl/workbook.xml', xml:
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" ' +
    'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>' +
    sheets.map(function(s, i){
      return '<sheet name="' + xmlEscape(s.name) + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>';
    }).join('') +
    '</sheets></workbook>' });

  files.push({ name: 'xl/_rels/workbook.xml.rels', xml:
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    sheets.map(function(s, i){
      return '<Relationship Id="rId' + (i + 1) + '" ' +
             'Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" ' +
             'Target="worksheets/sheet' + (i + 1) + '.xml"/>';
    }).join('') +
    '</Relationships>' });

  sheets.forEach(function(s, i){
    files.push({ name: 'xl/worksheets/sheet' + (i + 1) + '.xml', xml: sheetXml(s.rows) });
  });

  return makeZip(files);
}

function localTime(iso){
  if (!iso) return '';
  var d = new Date(iso);
  if (isNaN(d)) return String(iso);
  function p(n){ return (n < 10 ? '0' : '') + n; }
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' +
         p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}

/* 匯出時把整個主題撈完，不受畫面那 1000 筆上限影響 */
function fetchEverything(){
  if (!online) return Promise.resolve(entries.slice());
  var all = [], page = 0, SIZE = 1000;
  function step(){
    return sb.from(TABLE).select('id,word,created_at')
      .eq('room', room).order('id', { ascending: true })
      .range(page * SIZE, page * SIZE + SIZE - 1)
      .then(function(res){
        if (res.error) throw res.error;
        var rows = res.data || [];
        all = all.concat(rows);
        if (rows.length < SIZE) return all;
        page++;
        return step();
      });
  }
  return step();
}

function exportExcel(){
  var btn = $('exportBtn');
  btn.disabled = true;
  var original = btn.textContent;
  btn.textContent = '整理中…';

  fetchEverything().then(function(rows){
    if (!rows.length){
      toast('這個主題還沒有資料可以下載', true);
      return;
    }

    var counts = new Map();
    rows.forEach(function(r){ counts.set(r.word, (counts.get(r.word) || 0) + 1); });
    var ranked = [];
    counts.forEach(function(n, w){ ranked.push([w, n]); });
    ranked.sort(function(a, b){ return b[1] - a[1] || a[0].localeCompare(b[0], 'zh-Hant'); });

    var summary = [['主題', room], ['匯出時間', localTime(new Date().toISOString())],
                   ['投稿總數', rows.length], ['不同詞彙數', counts.size], [],
                   ['名次', '詞彙', '票數', '佔比']];
    ranked.forEach(function(p, i){
      summary.push([i + 1, p[0], p[1], Math.round(p[1] / rows.length * 1000) / 10 + '%']);
    });

    var raw = [['序號', '詞彙', '送出時間']];
    rows.forEach(function(r, i){ raw.push([i + 1, r.word, localTime(r.created_at)]); });

    var blob = buildWorkbook([
      { name: '詞彙統計', rows: summary },
      { name: '原始資料', rows: raw }
    ]);

    var now = new Date();
    function p(n){ return (n < 10 ? '0' : '') + n; }
    var stamp = now.getFullYear() + p(now.getMonth() + 1) + p(now.getDate()) +
                '_' + p(now.getHours()) + p(now.getMinutes());
    var safeRoom = room.replace(/[\\/:*?"<>|]/g, '_');
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = '文字雲_' + safeRoom + '_' + stamp + '.xlsx';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);

    toast('已下載 ' + rows.length + ' 筆資料');
  }).catch(function(err){
    toast('下載失敗：' + (err && err.message ? err.message : err), true);
  }).then(function(){
    btn.disabled = false;
    btn.textContent = original;
  });
}

/* ============================================================
   QR Code
   ============================================================ */
function shareUrl(){
  var u = new URL(location.href);
  u.search = (room && room !== 'default') ? ('?room=' + encodeURIComponent(room)) : '';
  u.hash = '';
  return u.toString();
}
var qrDrawnFor = null;
var QR_PIXELS = 1024;   // 產生時的解析度。畫面上只顯示兩三百 px，
                        // 但一定要「縮小」而不是「放大」，模組邊緣才不會糊掉。

function fallbackQr(url){
  var img = new Image();
  img.alt = 'QR Code';
  img.className = 'qr-code';
  // 這個外部服務的 qzone 參數就是靜空區，同樣補 4 個模組
  img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=800x800&qzone=4&data=' +
            encodeURIComponent(url);
  var frame = $('qrFrame');
  frame.innerHTML = '';
  frame.appendChild(img);
}

/* qrcodejs 畫出來的圖四周「完全沒有靜空區」—— 碼緊貼著圖片邊緣。
   QR 規格要求周圍留 4 個模組寬的白邊，掃描器靠它定位；少了就常常掃不到。
   這裡把它重畫到一張更大的白底畫布中央，把靜空區補回去。 */
function padQuietZone(src){
  var size = src.width || src.naturalWidth;
  // 這個網站的網址至少 30 幾個字元，QR 版本 ≥3（29 個模組），
  // 取 16% 保證任何情況都超過 4 個模組。靜空區多一點不會有壞處。
  var margin = Math.ceil(size * 0.16);
  var out = document.createElement('canvas');
  out.width = out.height = size + margin * 2;
  var ctx = out.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, out.width, out.height);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(src, margin, margin);
  return out;
}

function drawQr(){
  var url = shareUrl();
  var frame = $('qrFrame');

  if (location.protocol === 'file:'){
    $('qrUrl').textContent = '（目前是用本機檔案開啟，還沒有可分享的網址。部署到網路上之後，這裡會自動變成真正的網址。）';
    frame.innerHTML = '<div class="qr-note">部署到網路上之後<br>這裡會自動長出 QR Code</div>';
    return;
  }

  $('qrUrl').textContent = url;
  if (qrDrawnFor === url) return;

  if (window.QRCode){
    try {
      var stage = document.createElement('div');   // 先讓函式庫畫在暫存節點
      new QRCode(stage, {
        text: url, width: QR_PIXELS, height: QR_PIXELS,
        colorDark: '#2B2523', colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });
      var src = stage.querySelector('canvas');
      if (src && src.width){
        var padded = padQuietZone(src);
        padded.className = 'qr-code';
        padded.setAttribute('role', 'img');
        padded.setAttribute('aria-label', 'QR Code：' + url);
        frame.innerHTML = '';
        frame.appendChild(padded);
        qrDrawnFor = url;
        return;
      }
    } catch (e){ /* 落到下面的備援 */ }
  }
  fallbackQr(url);
  qrDrawnFor = url;
}

/* 投影時要讓全班一起掃，小小一張不夠 —— 點一下放大到滿版 */
function openBigQr(){
  var code = document.querySelector('#qrFrame .qr-code');
  if (!code) return;
  var big = $('qrBigFrame');
  big.innerHTML = '';
  if (code.tagName === 'CANVAS'){
    var copy = document.createElement('canvas');
    copy.width = code.width; copy.height = code.height;
    copy.getContext('2d').drawImage(code, 0, 0);
    copy.className = 'qr-code';
    big.appendChild(copy);
  } else {
    var im = new Image();
    im.src = code.src; im.className = 'qr-code';
    big.appendChild(im);
  }
  $('qrBigUrl').textContent = shareUrl();
  $('qrBig').hidden = false;
}

/* ============================================================
   介面事件
   ============================================================ */
/* ---------- 關鍵字確認面板 ---------- */
var suggested = [];       // [{word, on}]
var suggestSource = '';   // 原始輸入，按取消時還回輸入框
var confirmedText = '';   // 剛從關鍵字面板帶入輸入框的那一串，避免再被拆一次

function renderChips(){
  var box = $('suggestChips');
  box.innerHTML = '';
  suggested.forEach(function(item){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip-word' + (item.on ? '' : ' off');
    b.textContent = item.word;
    b.setAttribute('aria-pressed', item.on ? 'true' : 'false');
    b.addEventListener('click', function(){ item.on = !item.on; renderChips(); });
    box.appendChild(b);
  });
  var n = suggested.filter(function(i){ return i.on; }).length;
  $('suggestAdd').textContent = n ? ('帶入 ' + n + ' 個詞') : '帶入輸入框';
  $('suggestAdd').disabled = n === 0;
  $('suggestCount').textContent = '共抓到 ' + suggested.length + ' 個';
}

function openSuggest(words, source){
  suggested = words.map(function(w){ return { word: w, on: true }; });
  suggestSource = source;
  renderChips();
  $('suggestPanel').hidden = false;
}

function closeSuggest(){
  $('suggestPanel').hidden = true;
  suggested = [];
  suggestSource = '';
}

/* 挑好的關鍵字先回到輸入框，讓使用者再看一眼、還能改，
   自己按「加入」才真的進文字雲。 */
$('suggestAdd').addEventListener('click', function(){
  var picked = suggested.filter(function(i){ return i.on; }).map(function(i){ return i.word; });
  if (!picked.length) return;
  var text = picked.join('，');
  closeSuggest();
  var input = $('wordInput');
  input.value = text;
  confirmedText = text;   // 記住這串是剛確認過的，按加入時不要又被拆一次
  input.focus();
  try { input.setSelectionRange(text.length, text.length); } catch(e){}
  toast('已帶入輸入框，確認後按「加入」送出');
});

$('suggestCancel').addEventListener('click', function(){
  $('wordInput').value = suggestSource;
  closeSuggest();
  $('wordInput').focus();
});

$('wordForm').addEventListener('submit', function(e){
  e.preventDefault();
  var input = $('wordInput');
  var val = input.value.trim();
  if (!val){ input.focus(); return; }

  // 逗號分隔的詞直接送；某一段太長才先拆成關鍵字讓使用者確認。
  // 已經在關鍵字面板確認過、原封不動帶回來的那一串也直接送，不要重複拆。
  if (val === confirmedText || !needsExtraction(val)){
    input.value = '';
    input.focus();
    confirmedText = '';
    closeSuggest();
    submitWords(val);
    return;
  }

  var words = extractKeywords(val);
  if (!words.length){
    toast('沒抓到可用的關鍵字，試試直接輸入詞彙', true);
    return;
  }
  input.value = '';
  openSuggest(words, val);
});

if (isAdmin){
  $('revealBtn').addEventListener('click', function(){ setRevealed(!revealed); });
  $('previewBtn').addEventListener('click', function(){ preview = !preview; syncView(); });
  $('exportBtn').addEventListener('click', exportExcel);
}

$('toggleQr').addEventListener('click', function(){
  var p = $('qrPanel');
  p.classList.toggle('show');
  if (p.classList.contains('show')) drawQr();
});
$('closeQr').addEventListener('click', function(){ $('qrPanel').classList.remove('show'); });
$('qrFrame').addEventListener('click', openBigQr);
$('qrBigClose').addEventListener('click', function(){ $('qrBig').hidden = true; });
$('qrBig').addEventListener('click', function(e){ if (e.target === this) this.hidden = true; });
$('copyUrl').addEventListener('click', function(){
  var url = shareUrl();
  if (navigator.clipboard && location.protocol !== 'file:'){
    navigator.clipboard.writeText(url).then(
      function(){ toast('網址已複製'); },
      function(){ toast('複製失敗，請手動選取下方網址', true); });
  } else {
    toast('請手動選取下方網址複製', true);
  }
});

$('projectBtn').addEventListener('click', function(){
  document.body.classList.toggle('project');
  var on = document.body.classList.contains('project');
  this.textContent = on ? '離開投影' : '投影模式';
  if (on && document.documentElement.requestFullscreen){
    document.documentElement.requestFullscreen().catch(function(){});
  } else if (!on && document.fullscreenElement && document.exitFullscreen){
    document.exitFullscreen().catch(function(){});
  }
  setTimeout(render, 340);
});

$('undoBtn').addEventListener('click', undoLast);

if (isAdmin){
  $('adminBar').style.display = 'flex';
  $('roomInput').value = room;
  $('clearBtn').addEventListener('click', clearRoom);
  $('roomGo').addEventListener('click', function(){
    var v = $('roomInput').value.trim().slice(0, 40) || 'default';
    location.search = '?room=' + encodeURIComponent(v) + '&admin=1';
  });
}

document.addEventListener('keydown', function(e){
  if (e.key !== 'Escape') return;
  if (!$('qrBig').hidden){ $('qrBig').hidden = true; return; }
  $('qrPanel').classList.remove('show');
  if (!$('suggestPanel').hidden) $('suggestCancel').click();
});

var resizeTimer;
function relayoutSoon(delay){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function(){ render(); }, delay || 220);
}
window.addEventListener('resize', function(){ relayoutSoon(220); });

/* 舞台高度不是只有視窗縮放會變 —— 關鍵字面板一展開就會把舞台壓矮，
   底下的字會被切掉。直接盯著舞台本身的尺寸，變了就重排。 */
if (window.ResizeObserver){
  new ResizeObserver(function(){ relayoutSoon(160); }).observe(cloudEl);
}

// 分頁被切到背景時瀏覽器會凍結動畫，回到前景時把殘留的進場狀態清掉並重排，
// 避免出現「明明有詞卻一片空白」的情況。
document.addEventListener('visibilitychange', function(){
  if (!document.hidden){
    nodes.forEach(function(el){ el.classList.remove('enter'); });
    render();
  }
});

/* ============================================================
   啟動
   ============================================================ */
document.body.classList.toggle('is-student', !isAdmin);
$('roomChip').innerHTML = '主題：<b></b>';
$('roomChip').querySelector('b').textContent = room;
document.title = (room === 'default') ? '互動文字雲' : ('互動文字雲 · ' + room);

function boot(){
  if (booted) return;
  booted = true;
  syncView();
  drawQr();
  connect().then(function(){
    refreshUndo();
    syncView();
  }).catch(function(err){
    online = false;
    entries = localLoad();
    setStatus('離線模式（只存在這台裝置）', false);
    refreshUndo();
    syncView();
    console.warn('Supabase 連線失敗，改用本機模式：', err);
  });
}

if (document.fonts && document.fonts.ready){
  document.fonts.ready.then(boot);
  setTimeout(boot, 2500);
} else {
  boot();
}

})();
</script>
